name: Scheduled live-catalog update

# Runs the live product API branch daily, plus a manual "Run workflow"
# button for on-demand testing. The Olist branch is deliberately NOT part
# of this workflow — it's static historical data (same output every run)
# and needs CSVs that aren't committed to this repo; see
# scripts/run_scheduled_update.py for why.
on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

jobs:
  update-live-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live-catalog update
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python scripts/run_scheduled_update.py
